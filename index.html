<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="X-UA-Compatible"
			content="IE=edge"
		/>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0"
		/>

		<!-- Project Description -->
		<meta
			name="description"
			content="Salishan is a keyboard layout supporting Salishan and neighboring Indigenous languages of the Pacific Northwest, featuring dead keys, combining diacritics, and efficient input for glottalized, ejective, and lateral consonants."
		/>

		<title>Salishan Keyboard</title>

		<!-- Favicons -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="https://salishan.github.io/img/favicon.svg"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="256x256"
			href="https://salishan.github.io/img/favicon_256x256.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="128x128"
			href="https://salishan.github.io/img/favicon_128x128.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="64x64"
			href="https://salishan.github.io/img/favicon_64x64.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="48x48"
			href="https://salishan.github.io/img/favicon_48x48.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="https://salishan.github.io/img/favicon_32x32.png"
		/>
		<link
			rel="icon"

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="https://salishan.github.io/img/favicon_180x180.png"
		/>

		<meta
			name="msapplication-TileColor"
			content="#e9c200"
		/>
		<meta
			name="msapplication-TileImage"
			content="https://salishan.github.io/img/favicon_128x128.png"
		/>

		<!-- Open Graph Metadata -->
		<meta
			property="og:title"
			content="Salishan Languages Keyboard Support"
		/>
		<meta
			property="og:description"
			content="A comprehensive keyboard layout for Salishan languages, enabling intuitive typing of glottalized, ejective, tonal, and special characters used across the Pacific Northwest."
		/>
		<meta
			property="og:site_name"
			content="Salishan Keyboard"
		/>
		<meta
			property="og:image"
			content="https://salishan.github.io/img/salishan-preview.webp"
		/>

			property="og:image:type"
			content="image/png"
		/>
		<meta
			property="og:image:width"
			content="1200"
		/>
		<meta
			property="og:image:height"
			content="630"
		/>

		<!-- Scripts & Styles -->
		<link
			rel="stylesheet"
			href="./css/salishan.css"
		/>
		<script type="module">
			import './js/head.js'
			import './js/component_cinematic.js'
		</script>

	<body class="salishan-home">
		<salishan-navbar no-searchbar></salishan-navbar>
